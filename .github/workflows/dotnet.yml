# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build AlphaID

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install SQL Server LocalDB
      uses: potatoqualitee/mssqlsuite@v1.8
      with:
        # The apps to install
        install: localdb
        version: 2019
    - name: Restore dependencies
      run: dotnet restore AlphaID.slnx -v m
      working-directory: src/AlphaID
    - name: Build
      run: dotnet build AlphaID.slnx --no-restore --configuration Release -v m
      working-directory: src/AlphaID
    # - name: Run database tool
    #   run: ./DatabaseTool.exe NonInteractive --environment Development
    #   working-directory: src/AlphaID/DatabaseTool/bin/Release/net10.0/
    - name: Test
      # .NET 10 SDK 下 dotnet test 必须显式选用 MTP runner（见仓库根目录 global.json 的 test.runner），
      # 否则 MTP 测试应用走 VSTest target 会直接报错。
      # MTP 模式下位置参数只接受项目，解决方案必须用 --solution。
      # 必须带 -c Release：Build 步骤用 Release 且这里 --no-build，配置不一致会找不到测试程序集。
      run: dotnet test --solution AlphaID.slnx --configuration Release --no-build -v m
      working-directory: src/AlphaID